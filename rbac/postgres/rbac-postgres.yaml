apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-prod-manager
  namespace: postgres-operator
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - configmaps
      - secrets
      - persistentvolumeclaims
      - serviceaccounts
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cao-tuan-dung-postgres-prod-manager
  namespace: postgres-operator
subjects:
  - kind: User
    name: m-9jmn2
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: postgres-prod-manager
  apiGroup: rbac.authorization.k8s.io
---
