apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: postgres-operator-installer
rules:
  # Namespace là cluster-scoped resource, không cấp được bằng Role trong namespace
  - apiGroups: [""]
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch

  # CRD để cài Operator
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Cluster RBAC cho Operator
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
      - clusterrolebindings
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # StorageClass để Operator/PVC dùng storage backend
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # PV là cluster-scoped resource
  - apiGroups: [""]
    resources:
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cao-tuan-dung-postgres-operator-installer
subjects:
  - kind: User
    name: m-9jmn2
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: postgres-operator-installer
  apiGroup: rbac.authorization.k8s.io