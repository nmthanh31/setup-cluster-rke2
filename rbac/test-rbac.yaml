apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-full-access
  namespace: cattle-monitoring-system
rules:
- apiGroups: [""]
  resources:
  - services
  - services/proxy
  - endpoints
  - pods
  - configmaps
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-full-access-m-lwjtk
  namespace: cattle-monitoring-system
subjects:
- kind: User
  name: m-lwjtk
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: grafana-full-access
  apiGroup: rbac.authorization.k8s.io