apiVersion: v1
kind: Service
metadata:
  name: valkey-cluster-0-nodeport
  namespace: valkey-cluster
  labels:
    app: valkey-cluster
    access: dev-nodeport
spec:
  type: NodePort
  selector:
    app: valkey-cluster
    statefulset.kubernetes.io/pod-name: valkey-cluster-0
  ports:
    - name: client
      port: 6379
      targetPort: 6379
      nodePort: 31000
