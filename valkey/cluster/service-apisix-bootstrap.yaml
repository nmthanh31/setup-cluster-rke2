apiVersion: v1
kind: Service
metadata:
  name: valkey-cluster-bootstrap
  namespace: valkey-cluster
  labels:
    app: valkey-cluster
    access: apisix-bootstrap
spec:
  type: ClusterIP
  selector:
    app: valkey-cluster
  ports:
    - name: client
      protocol: TCP
      port: 6379
      targetPort: 6379
