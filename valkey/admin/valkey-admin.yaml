apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-admin
  namespace: valkey-cluster
  labels:
    app.kubernetes.io/name: valkey-admin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey-admin
    spec:
      containers:
        - name: valkey-admin
          image: valkey/valkey-admin:1.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: DEPLOYMENT_MODE
              value: Web
            - name: VALKEY_HOST
              value: valkey-cluster-0-nodeport.valkey-cluster.svc.cluster.local
            - name: VALKEY_PORT
              value: "6379"
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-cluster-auth
                  key: password
            - name: VALKEY_TLS
              value: "false"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-admin
  namespace: valkey-cluster
  labels:
    app.kubernetes.io/name: valkey-admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: valkey-admin
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
