apiVersion: v1
kind: Service
metadata:
  name: valkey-headless
  namespace: valkey
spec:
  clusterIP: None
  selector:
    app: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-sentinel
  namespace: valkey
spec:
  type: ClusterIP
  selector:
    app: valkey-sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-sentinel-headless
  namespace: valkey
spec:
  clusterIP: None
  selector:
    app: valkey-sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379