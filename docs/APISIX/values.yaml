apisix:
  # Enable both HTTP and Stream (TCP/UDP) proxies
  proxy_mode: http&stream

# Define the stream ports APISIX will listen on
service:
  # Expose APISIX through every Kubernetes node.
  # Kubernetes assigns a NodePort for stream port 9000. Retrieve it with:
  # kubectl -n apisix get svc apisix-gateway \
  #   -o jsonpath="{.spec.ports[?(@.port==9000)].nodePort}"
  type: NodePort
  externalTrafficPolicy: Cluster
  http:
    enabled: true
  stream:
    enabled: true
    tcp:
      # APISIX TCP listener used as the Valkey Cluster bootstrap endpoint.
      - port: 9000
