---
- name: Ensure SSH user exists
  ansible.builtin.user:
    name: "{{ ssh_user }}"
    state: present
    shell: /bin/bash

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "/home/{{ ssh_user }}/.ssh"
    state: directory
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: "0700"

- name: Install authorized SSH keys
  ansible.builtin.authorized_key:
    user: "{{ ssh_user }}"
    key: "{{ item }}"
    state: present
    exclusive: false
  loop: "{{ ssh_authorized_keys }}"
  when: ssh_manage_authorized_keys | bool

- name: Ensure sshd_config.d directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy SSH hardening config
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "sshd -t -f %s"
  notify: Reload ssh

- name: Validate final sshd config
  ansible.builtin.command: sshd -t
  changed_when: false
