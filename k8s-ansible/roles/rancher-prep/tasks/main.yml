---
- name: Tạo thư mục chứa Rancher images trên server
  ansible.builtin.file:
    path: "{{ rancher_images_dest_path }}"
    state: directory
    mode: '0755'

- name: Copy tất cả file từ rancher-images cục bộ lên server
  ansible.builtin.copy:
    src: "{{ rancher_images_local_path }}/"
    dest: "{{ rancher_images_dest_path }}/"
    mode: '0644'

- name: Load Rancher images vào containerd (RKE2)
  ansible.builtin.shell: |
    for img in {{ rancher_images_dest_path }}/*.tar; do
      if [ -f "$img" ]; then
        echo "Loading $img..."
        /var/lib/rancher/rke2/bin/ctr --address /run/k3s/containerd/containerd.sock --namespace k8s.io images import "$img"
      fi
    done
  when: rancher_load_images | bool
  register: load_result
  changed_when: "'imported' in load_result.stdout"
  failed_when: false # Tránh lỗi nếu chưa có RKE2 hoặc không có file tar
