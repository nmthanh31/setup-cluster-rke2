apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: redis
spec:
  clusterIP: None
  selector:
    app: redis
  publishNotReadyAddresses: true
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis
# spec:
#   type: ClusterIP
#   selector:
#     app: redis
#   ports:
#     - name: redis
#       port: 6379
#       targetPort: 6379
spec:
  type: NodePort
  selector:
    statefulset.kubernetes.io/pod-name: redis-0
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      nodePort: 30379